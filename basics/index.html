<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="a minimal, offline 3×3 speedcubing timer for android.">
<link rel="canonical" href="https://bivid.site/basics/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://bivid.site/basics/">
<meta property="og:title" content="basics. — offline speedcubing timer">
<meta property="og:description" content="an offline android timer for 3×3 speedcubing.">
<meta name="theme-color" content="#131313">
<link rel="icon" href="assets/icon.png">
<link rel="stylesheet" href="style.css?v=3">
<title>basics. — offline speedcubing timer</title>
<script src="site.js?v=3" defer></script>
</head>
<body>
<header class="shell nav">
  <a class="wordmark" href="#" aria-label="basics. home"><img class="logo" src="assets/icon.png" width="24" height="24" alt="">basics.</a>
  <nav aria-label="main navigation"><a href="#app">the app</a><a class="repo" href="https://github.com/biiviid/basics">github</a></nav>
</header>
<main>
  <section class="shell hero" aria-labelledby="intro">
    <div class="intro">
      <h1 id="intro">basics.</h1>
      <p class="lead">an offline 3×3 timer for android.</p>
    </div>
    <div class="instrument">
      <div class="instrument-head"><span>timer demo</span></div>
      <div class="scramble"><p>R U R' F2 D L2 U' B2<br>R2 F D' B U2 L F' R</p></div>
      <div class="readout" aria-hidden="true">
        <span>0</span><b>:</b><span>0</span><span>0</span><b>.</b><span>0</span><span>0</span><span>0</span>
      </div>
      <div id="timer-status" class="sr-only" role="status"></div>
      <div class="instrument-foot"><button id="timer-button" type="button" disabled>start timer</button><button id="reset-button" type="button" disabled>reset</button></div>
    </div>
  </section>
  <section id="app" class="showcase" aria-label="app screens">
    <div class="shell gallery">
      <div class="device-stage">
        <div class="device"><img id="app-shot" src="assets/timer.png" width="1080" height="2400" alt="basics. android timer showing a scramble, solve time, and cube diagram" loading="lazy"></div>
      </div>
      <div class="gallery-content">
        <div class="gallery-controls" aria-label="app screenshots">
          <button type="button" data-panel="timer" aria-pressed="true">timer</button>
          <button type="button" data-panel="history" aria-pressed="false">history</button>
          <button type="button" data-panel="stats" aria-pressed="false">stats</button>
          <button type="button" data-panel="charts" aria-pressed="false">charts</button>
        </div>
      </div>
    </div>
  </section>
</main>
<footer class="shell footer">
  <a href="https://biiviid.github.io/basics/privacy-policy.html">privacy policy</a>
</footer>
</body>
</html>
