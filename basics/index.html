<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="a minimal, offline 3×3 speedcubing timer for android.">
<link rel="canonical" href="https://bivid.site/basics/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://bivid.site/basics/">
<meta property="og:title" content="basics. — offline speedcubing timer">
<meta property="og:description" content="an offline android timer for 3×3 speedcubing.">
<meta name="theme-color" content="#131313">
<link rel="icon" href="assets/icon.png">
<link rel="stylesheet" href="style.css?v=5">
<title>basics. — offline speedcubing timer</title>
</head>
<body>
<header class="shell nav">
  <a class="wordmark" href="#" aria-label="basics. home"><img class="logo" src="assets/icon.png" width="24" height="24" alt="">basics.</a>
  <nav aria-label="main navigation"><a href="#app">the app</a><a href="https://github.com/biiviid/basics">github</a></nav>
</header>
<main>
  <section class="shell hero" aria-labelledby="intro">
    <div class="intro">
      <h1 id="intro">
        <span>a speedcube timer,</span>
        <span>from a speedcuber going back to the</span>
        <strong>basics.</strong>
      </h1>
    </div>
    <figure class="timer-shot">
      <div class="shot-frame">
        <img src="assets/timer.png?v=2" width="1080" height="2280" alt="the timer screen with a scramble, a solve time, and a cube diagram">
      </div>
    </figure>
  </section>
  <section id="app" class="showcase" aria-label="history, stats, and charts">
    <div class="shell">
      <div class="gallery">
        <figure>
          <div class="shot-frame">
            <img src="assets/history.png?v=2" width="1080" height="2280" alt="a session's solve history with individual times and scrambles" loading="lazy">
          </div>
        </figure>
        <figure>
          <div class="shot-frame">
            <img src="assets/stats.png?v=2" width="1080" height="2280" alt="session statistics with best times and rolling averages" loading="lazy">
          </div>
        </figure>
        <figure>
          <div class="shot-frame">
            <img src="assets/charts.png?v=2" width="1080" height="2280" alt="a solve progression line chart and a distribution chart" loading="lazy">
          </div>
        </figure>
      </div>
    </div>
  </section>
</main>
<footer class="shell footer">
  <a href="https://biiviid.github.io/basics/privacy-policy.html">privacy policy</a>
  <a href="terms/">terms of service</a>
</footer>
</body>
</html>
