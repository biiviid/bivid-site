<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="a minimal, offline 3×3 speedcubing timer for android.">
<link rel="canonical" href="https://bivid.site/basics/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://bivid.site/basics/">
<meta property="og:title" content="basics. — offline speedcubing timer">
<meta property="og:description" content="an offline android timer for 3×3 speedcubing.">
<meta name="theme-color" content="#131313">
<link rel="icon" href="assets/icon.png">
<link rel="stylesheet" href="style.css?v=4">
<title>basics. — offline speedcubing timer</title>
</head>
<body>
<header class="shell nav">
  <a class="wordmark" href="#" aria-label="basics. home"><img class="logo" src="assets/icon.png" width="24" height="24" alt="">basics.</a>
  <nav aria-label="main navigation"><a href="#app">the app</a><a href="https://github.com/biiviid/basics">github</a></nav>
</header>
<main>
  <section class="shell hero" aria-labelledby="intro">
    <div class="intro">
      <h1 id="intro">basics.</h1>
      <p class="lead">an offline 3×3 speedcubing timer for android.</p>
      <p class="origin">i built basics. to get back to what i enjoy about speedcubing: scramble, solve, repeat.</p>
    </div>
    <figure class="timer-shot">
      <div class="shot-frame">
        <img src="assets/timer.png" width="1080" height="2400" alt="the timer screen with a scramble, a solve time, and a cube diagram">
      </div>
      <figcaption>
        <strong>timer</strong>
        <p>practice with 3×3 scrambles and optional 15-second inspection.</p>
      </figcaption>
    </figure>
  </section>
  <section id="app" class="showcase" aria-labelledby="after-the-solve">
    <div class="shell">
      <h2 id="after-the-solve">after the solve</h2>
      <div class="gallery">
        <figure>
          <div class="shot-frame">
            <img src="assets/history.png" width="1080" height="2400" alt="a session's solve history with individual times and scrambles" loading="lazy">
          </div>
          <figcaption>
            <strong>history</strong>
            <p>revisit your times, scrambles, and penalties.</p>
          </figcaption>
        </figure>
        <figure>
          <div class="shot-frame">
            <img src="assets/stats.png" width="1080" height="2400" alt="session statistics with best times and rolling averages" loading="lazy">
          </div>
          <figcaption>
            <strong>stats</strong>
            <p>check personal bests and rolling averages like ao5 and ao12.</p>
          </figcaption>
        </figure>
        <figure>
          <div class="shot-frame">
            <img src="assets/charts.png" width="1080" height="2400" alt="a solve progression line chart and a distribution chart" loading="lazy">
          </div>
          <figcaption>
            <strong>charts</strong>
            <p>see how your times change and where most solves land.</p>
          </figcaption>
        </figure>
      </div>
    </div>
  </section>
</main>
<footer class="shell footer">
  <a href="https://biiviid.github.io/basics/privacy-policy.html">privacy policy</a>
</footer>
</body>
</html>
